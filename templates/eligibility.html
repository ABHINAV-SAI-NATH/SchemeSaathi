<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Eligibility - SchemeSaathi</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>

        <h2>SchemeSaathi</h2>

        <nav>
            <a href="/">Home</a>
            <a href="#">Schemes</a>
            <a href="/eligibility">Check Eligibility</a>
        </nav>

    </header>


    <main>

        <section class="form-section">

            <h1>Find Schemes For You</h1>

            <p>
                Answer a few simple questions and we'll find
                schemes that may be relevant to you.
            </p>


            <form method="POST" action="/eligibility">

                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    name="age"
                    min="0"
                    max="120"
                    required
                >


                <label for="gender">Gender</label>

                <select id="gender" name="gender" required>

                    <option value="">
                        Select gender
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>


                <label for="state">State</label>

                <select id="state" name="state" required>

                    <option value="">
                        Select state
                    </option>

                    <option value="punjab">
                        Punjab
                    </option>

                    <option value="haryana">
                        Haryana
                    </option>

                    <option value="delhi">
                        Delhi
                    </option>

                    <option value="uttar_pradesh">
                        Uttar Pradesh
                    </option>

                    <option value="bihar">
                        Bihar
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>


                <label for="income">
                    Annual Family Income
                </label>

                <select id="income" name="income" required>

                    <option value="">
                        Select income range
                    </option>

                    <option value="1">
                        Below ₹1 lakh
                    </option>

                    <option value="2">
                        ₹1–3 lakh
                    </option>

                    <option value="3">
                        ₹3–5 lakh
                    </option>

                    <option value="4">
                        ₹5–10 lakh
                    </option>

                    <option value="5">
                        Above ₹10 lakh
                    </option>

                </select>


                <label for="occupation">
                    Current Status
                </label>

                <select id="occupation" name="occupation" required>

                    <option value="">
                        Select
                    </option>

                    <option value="student">
                        Student
                    </option>

                    <option value="employed">
                        Employed
                    </option>

                    <option value="unemployed">
                        Unemployed
                    </option>

                    <option value="self_employed">
                        Self-employed
                    </option>

                    <option value="farmer">
                        Farmer
                    </option>

                </select>


                <label for="category">
                    Social Category
                </label>

                <select id="category" name="category" required>

                    <option value="">
                        Select
                    </option>

                    <option value="general">
                        General
                    </option>

                    <option value="obc">
                        OBC
                    </option>

                    <option value="sc">
                        SC
                    </option>

                    <option value="st">
                        ST
                    </option>

                </select>


                <button type="submit">
                    Find My Schemes
                </button>

            </form>

        </section>

    </main>

</body>

</html>
